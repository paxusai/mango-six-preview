<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1200" height="1200" viewBox="0 0 1200 1200">
<title>Mango bingsu at Cafe MangoSix (illustration placeholder)</title>
<desc>Vector illustration standing in for a real caf&#233; photo. A Korean mango bingsu in a dark stoneware bowl on a round wood board: a tall snowy mound of finely shaved ice topped with glossy cubes of ripe mango, a drizzle of golden mango syrup, a small heap of sweet red bean and a scoop of vanilla ice cream. A single warm spotlight falls from above onto a charcoal background with a soft mango-gold glow.</desc>
<defs>
<radialGradient id="mb-bg" cx=".5" cy=".38" r=".75"><stop offset="0" stop-color="#2f3332"/><stop offset=".6" stop-color="#1f2322"/><stop offset="1" stop-color="#121514"/></radialGradient>
<radialGradient id="mb-glow"><stop offset="0" stop-color="#F5A623" stop-opacity=".38"/><stop offset=".5" stop-color="#E07B1A" stop-opacity=".12"/><stop offset="1" stop-color="#E07B1A" stop-opacity="0"/></radialGradient>
<linearGradient id="mb-cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE2B0" stop-opacity=".45"/><stop offset=".45" stop-color="#F5A623" stop-opacity=".12"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/></linearGradient>
<linearGradient id="mb-can" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070808"/><stop offset=".3" stop-color="#363c3a"/><stop offset=".55" stop-color="#121514"/><stop offset="1" stop-color="#050606"/></linearGradient>
<radialGradient id="mb-lglow"><stop offset="0" stop-color="#FFF3D6"/><stop offset=".22" stop-color="#FFC46B" stop-opacity=".55"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/></radialGradient>
