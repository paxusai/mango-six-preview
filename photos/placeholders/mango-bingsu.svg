<radialGradient id="mb-warm"><stop offset="0" stop-color="#F5A623" stop-opacity=".25"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/></radialGradient>
<radialGradient id="mb-board" cx=".45" cy=".35" r=".7"><stop offset="0" stop-color="#b98450"/><stop offset=".55" stop-color="#86593a"/><stop offset="1" stop-color="#4f3521"/></radialGradient>
<linearGradient id="mb-bowl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e100f"/><stop offset=".28" stop-color="#3b403e"/><stop offset=".55" stop-color="#222625"/><stop offset="1" stop-color="#0a0b0b"/></linearGradient>
<radialGradient id="mb-ice" cx=".45" cy=".22" r=".85"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#f8f3ea"/><stop offset=".75" stop-color="#ddd6ca"/><stop offset="1" stop-color="#a8a49d"/></radialGradient>
