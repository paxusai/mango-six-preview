<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1200" height="1500" viewBox="0 0 1200 1500">
<title>Cafe MangoSix wood wall and wordmark (illustration placeholder)</title>
<desc>Vector illustration standing in for a real caf&#233; photo. A close, portrait view of the warm vertical wood-panel feature wall at Cafe MangoSix, lit by two black track spotlights whose amber cones wash the planks. An abstract brush-stroke human figure painted in black sits above a large stacked MANGO / SIX wordmark in bold black geometric lettering. An olive leather armchair and part of a round wood table with a coffee cup sit in the foreground.</desc>
<defs>
<linearGradient id="wm-ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f0e"/><stop offset="1" stop-color="#1f2221"/></linearGradient>
<linearGradient id="wm-topsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
