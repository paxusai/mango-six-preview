<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1600" height="1067" viewBox="0 0 1600 1067">
<title>Cafe MangoSix dining room, wide view (illustration placeholder)</title>
<desc>Vector illustration standing in for a real caf&#233; photo. A wide night-mode view of the spacious Cafe MangoSix room: charcoal walls and ceiling, two rows of black track lights casting warm amber light cones and pools of light on the floor, a warm wood-panel feature wall on the right with a small MANGO SIX mark under a brush-stroke figure, round wood tables with olive leather armchairs, a long dark banquette along the left wall, a framed coffee-harvest mural on the back wall and two industrial metal stools.</desc>
