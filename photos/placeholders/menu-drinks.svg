<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Cafe MangoSix iced drinks lineup (illustration placeholder)</title>
<desc>Vector illustration standing in for a real caf&#233; photo. Five tall clear iced cups lined up on a dark wood counter under warm track spotlights, styled like menu-board studio shots: mango juice, mango and coconut with a white coconut layer over gold, a strawberry cream smoothie topped with whipped cream and a strawberry, a lime-blue limeade with a lemon wheel, and a beige milk bubble tea with dark tapioca pearls. Each cup shows ice cubes, glass highlights and condensation drops against a charcoal background.</desc>
