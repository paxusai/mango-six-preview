<title>Cafe MangoSix coffee harvest mural (illustration placeholder)</title>
<desc>Vector illustration standing in for a real caf&#233; photo. A charcoal wall at Cafe MangoSix with a wide mural in a thin black frame showing a stylized coffee harvest: silhouetted workers in straw hats bent over a long raised table sorting red coffee cherries, baskets of cherries, coffee plants with green leaves and rolling earthy hills at golden hour. Black track lights above wash the mural with warm amber light, and the top of a wood table with a takeaway cup sits in the foreground.</desc>
